format = """
[\uE0B6](fg:#16161E)[$directory](bg:#16161E)[\uE0B2](fg:#1F2335 bg:#16161E)[\uE0B0](fg:#16161E bg:#1F2335)$git_branch[\uE0B0](fg:#1F2335 bg:#1A1B2E)$git_status[\uE0B0](fg:#1A1B2E bg:none)
$character """
add_newline = true

[directory]
style = "bg:#16161E fg:#A9B1D6"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[ $symbol$branch ]($style)"
symbol = " "
style = "bg:#1F2335 fg:#7AA2F7"

[git_status]
format = "[ $all_status$ahead_behind ]($style)"
style = "bg:#1A1B2E fg:#E0AF68"
ahead = "⇡"
behind = "⇣"
diverged = "⇋"
staged = "+"
modified = "~"
untracked = "?"
deleted = "-"
conflicted = "!"

[character]
success_symbol = "[❯](bold #7AA2F7)"
error_symbol = "[❯](bold #F7768E)"
